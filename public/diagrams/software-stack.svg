<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" fill="none">
  <rect width="820" height="300" rx="14" fill="#0f0f14" stroke="#27272a" stroke-width="1.5"/>
  <text x="32" y="38" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">C02 · THE SOFTWARE STACK (BOTTOM TO TOP)</text>

  <rect x="90" y="64" width="640" height="58" rx="10" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6"/>
  <text x="410" y="90" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="15" font-weight="600">3. Applications (Application Software)</text>
  <text x="410" y="110" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="12">Chrome · VS Code · Word · Games · Spotify</text>

  <rect x="90" y="138" width="640" height="58" rx="10" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6"/>
  <text x="410" y="164" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="15" font-weight="600">2. Operating System (System Software)</text>
  <text x="410" y="184" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12">Windows · macOS · GNU/Linux · Android (Mediates user &amp; hardware)</text>

  <rect x="90" y="212" width="640" height="58" rx="10" fill="#27272a" stroke="#52525b"/>
  <text x="410" y="238" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="15" font-weight="600">1. Hardware (Physical Layer)</text>
  <text x="410" y="258" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">CPU · GPU · RAM · SSD / HDD · Input &amp; Output Devices</text>
</svg>
