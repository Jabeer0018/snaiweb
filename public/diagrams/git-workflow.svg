<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" fill="none">
  <rect width="820" height="230" rx="14" fill="#0f0f14" stroke="#27272a" stroke-width="1.5"/>
  <text x="32" y="38" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">GIT &amp; GITHUB WORKFLOW</text>

  <rect x="32" y="76" width="160" height="84" rx="10" fill="#18181f" stroke="#3f3f46"/>
  <text x="112" y="110" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Working Folder</text>
  <text x="112" y="134" text-anchor="middle" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="11">edit · git status</text>

  <path d="M192 118 L236 118" stroke="#8b5cf6" stroke-width="2"/>
  <text x="214" y="106" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, monospace" font-size="10">git add</text>

  <rect x="236" y="76" width="160" height="84" rx="10" fill="#8b5cf6" fill-opacity="0.14" stroke="#8b5cf6"/>
  <text x="316" y="110" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Staging Area</text>
  <text x="316" y="134" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, monospace" font-size="11">selected changes</text>

  <path d="M396 118 L444 118" stroke="#8b5cf6" stroke-width="2"/>
  <text x="420" y="106" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, monospace" font-size="10">commit</text>

  <rect x="444" y="76" width="160" height="84" rx="10" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6"/>
  <text x="524" y="110" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Local Repo (.git)</text>
  <text x="524" y="134" text-anchor="middle" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="11">HEAD · git log</text>

  <path d="M604 118 L648 118" stroke="#10b981" stroke-width="2"/>
  <text x="626" y="106" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10">push</text>

  <rect x="648" y="76" width="140" height="84" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981"/>
  <text x="718" y="110" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14" font-weight="600">GitHub Remote</text>
  <text x="718" y="134" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11">clone / pull / PR</text>

  <text x="410" y="198" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-size="12">Change → Check (status) → Select (add) → Record (commit) → Share (push)</text>
